name: refresh repo snapshot

# Hosting lives on Vercel, which builds on every push to main. This job keeps the
# committed snapshot of the org's public repos current; when it changes, the commit
# it pushes is what triggers the Vercel redeploy. Vercel itself never has to call
# the GitHub API from a shared, rate-limited build IP.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-repos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build.mjs --snapshot

      - name: Verify the site still builds from it
        env:
          USE_SNAPSHOT: '1'
        run: node scripts/build.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/repos.snapshot.json; then
            echo "no repo changes today"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.snapshot.json
          git commit -m "chore: refresh repo snapshot"
          git push
