# yatr - https://github.com/cargopete/yatr
#
# Task names are the same across every nightswatchhq repo, so `yatr ci` means
# the same thing wherever you are. Note that `ci` is deliberately not called
# `check`: `yatr check` is a builtin that validates this file, and it shadows
# any task of that name without warning.

# No package.json and no dependencies: vercel.json runs `node scripts/build.mjs`
# and serves dist/. These tasks are that, plus the checks worth having.

[settings]
cache = true

[tasks.build]
desc = "Build the static site into dist/ (what Vercel runs)"
run = ["node scripts/build.mjs"]
sources = ["src/**/*", "data/**/*", "scripts/**/*.mjs"]
outputs = ["dist"]

[tasks.serve]
desc = "Serve the built site on :8000"
run = ["python3 -m http.server 8000 --directory dist"]
depends = ["build"]
foreground = true
no_cache = true

[tasks.data]
desc = "Fail if data/*.json is not valid JSON"
shell = true
run = ["for f in data/*.json; do python3 -m json.tool \"$f\" > /dev/null || exit 1; echo \"ok $f\"; done"]
sources = ["data/**/*.json"]

[tasks.links]
desc = "Fail if a relative markdown link points at a file that is not there"
shell = true
sources = ["**/*.md"]
run = ['''
missing=0
for f in $(git ls-files '*.md'); do
  d=$(dirname "$f")
  for l in $(grep -oE '\]\([^)]+\)' "$f" | sed 's/^](//;s/)$//' | grep -vE '^(https?:|mailto:|#|<)' | sed 's/#.*$//'); do
    [ -z "$l" ] && continue
    if [ ! -e "$d/$l" ]; then echo "broken: $f -> $l"; missing=$((missing+1)); fi
  done
done
if [ "$missing" -ne 0 ]; then echo "$missing broken relative link(s)"; exit 1; fi
echo "all relative markdown links resolve"
''']

[tasks.ci]
desc = "What a deploy needs to be true: data, links, build"
depends = ["data", "links", "build"]
run = []

[tasks.mark]
desc = "Redraw the sigil from scripts/make-mark.py"
run = ["python3 scripts/make-mark.py"]
